name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Build
        run: npm run build

  # 本体のジョブで確かめないのは、拡張機能は依存（@types/vscode など）を別に入れる別のパッケージで、本体の npm ci では型を解決できないため
  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker compose build
      - name: Smoke test
        run: docker compose up -d --wait --wait-timeout 60
      # sandbox のヘルスチェックだけで済ませないのは、アプリのコンテナのユーザーがソケットにつなげることまでは確かめられないため
      - name: Run code in the sandbox
        run: |
          docker compose exec -T app node -e '
            const req = require("node:http").request({ socketPath: "/run/sandbox/sandbox.sock", path: "/run", method: "POST" }, (res) => {
              let body = ""
              res.on("data", (chunk) => (body += chunk))
              res.on("end", () => {
                console.log(body)
                process.exit(JSON.parse(body).stdout === "ok\n" ? 0 : 1)
              })
            })
            req.end(JSON.stringify({ language: "python", code: "print(\"ok\")" }))
          '
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 既定の fetch-depth: 1 ではベースブランチとの merge-base を求められない
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check migrations
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: npm run db:check -- "$BASE_REF"
      - name: Check Moodle mode migrations
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: npm run db:check:moodle -- "$BASE_REF"
