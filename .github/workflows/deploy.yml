name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # conclusion だけで判定しないのは、PR の CI 完了でも workflow_run が発火するため
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: [self-hosted, linux]
    environment: production
    timeout-minutes: 20
    env:
      HOST_PORT: ${{ vars.DEPLOY_HOST_PORT || '3000' }}
      HOST_BIND: ${{ vars.DEPLOY_HOST_BIND || '127.0.0.1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Write env file
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          ENV_FILE="$RUNNER_TEMP/step-learn.env"
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          umask 077
          : > "$ENV_FILE"
          for name in SESSION_SECRET APP_ORIGIN TRUST_PROXY \
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET \
            SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM; do
            value="${!name}"
            [ -z "$value" ] && continue
            # 引用符なしやダブルクォートで書かないのは、Compose が値の中の $ を変数として展開してしまうため
            case "$value" in
              *"'"* | *$'\n'*)
                echo "::error::$name に ' や改行は使えません"
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$name" "$value" >> "$ENV_FILE"
          done
      - name: Build image
        run: docker compose build
      - name: Start
        run: docker compose up -d --wait --wait-timeout 60
      - name: Show logs
        if: failure()
        run: docker compose logs --tail 200
      - name: Prune old images
        run: docker image prune -f
      - name: Remove env file
        if: always()
        run: rm -f "$RUNNER_TEMP/step-learn.env"
