name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # サーバーで docker compose build しないのは、本番が動いたままの小さな VPS で npm ci と vite build を走らせると、メモリが足りなくなるため
  build:
    name: build images
    # conclusion だけで判定しないのは、PR の CI 完了でも workflow_run が発火するため
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: step-learn
            context: .
          - name: step-learn-sandbox
            context: ./sandbox
          - name: step-learn-browser
            context: ./browser
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  beta:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      environment: beta
      tag: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  # beta と同時に入れないのは、beta で起動できなかった版を本番に入れないため。承認を挟むなら、Environment production に保護ルールを付ける
  production:
    needs: beta
    # 変数なしで動かさないのは、本番のランナーを登録する前だとランナーを待ったまま concurrency を握り、beta のデプロイまで止まるため
    if: vars.DEPLOY_PRODUCTION == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      environment: production
      tag: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
