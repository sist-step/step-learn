name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (${{ matrix.environment }})
    # conclusion だけで判定しないのは、PR の CI 完了でも workflow_run が発火するため
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    strategy:
      # 止めないのは、片方のサーバーの失敗でもう片方のデプロイまで取り消さないため
      fail-fast: false
      matrix:
        include:
          - environment: production
            runner: production
            project: step-learn
          # プロジェクト名を分けるのは、2 つのランナーが同じホストにあっても、コンテナとボリュームを取り合わないため
          - environment: beta
            runner: beta
            project: step-learn-beta
    runs-on: [self-hosted, linux, '${{ matrix.runner }}']
    environment: ${{ matrix.environment }}
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ${{ matrix.project }}
      HOST_PORT: ${{ vars.DEPLOY_HOST_PORT || '3000' }}
      HOST_BIND: ${{ vars.DEPLOY_HOST_BIND || '127.0.0.1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Write env file
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MOODLE_URL: ${{ vars.MOODLE_URL }}
          MOODLE_EXCHANGE_TOKEN: ${{ secrets.MOODLE_EXCHANGE_TOKEN }}
          MOODLE_BACKCHANNEL_SECRET: ${{ secrets.MOODLE_BACKCHANNEL_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          AI_EMAIL_DOMAIN: ${{ vars.AI_EMAIL_DOMAIN }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT: ${{ vars.MICROSOFT_TENANT }}
        run: |
          ENV_FILE="$RUNNER_TEMP/step-learn.env"
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          umask 077
          : > "$ENV_FILE"
          for name in SESSION_SECRET APP_ORIGIN TRUST_PROXY \
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET \
            SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM \
            MOODLE_URL MOODLE_EXCHANGE_TOKEN MOODLE_BACKCHANNEL_SECRET \
            OPENROUTER_API_KEY CLAUDE_API_KEY AI_EMAIL_DOMAIN \
            MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_TENANT; do
            value="${!name}"
            [ -z "$value" ] && continue
            # 引用符なしやダブルクォートで書かないのは、Compose が値の中の $ を変数として展開してしまうため
            case "$value" in
              *"'"* | *$'\n'*)
                echo "::error::$name に ' や改行は使えません"
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$name" "$value" >> "$ENV_FILE"
          done
      - name: Build image
        run: docker compose build
      - name: Start
        run: docker compose up -d --wait --wait-timeout 60
      # ログを出さないのは、SMTP 未設定のときはパスワード再設定や登録のリンク（トークン付き）が標準出力に出ていて、
      # Actions のログを読める人に渡ってしまうため。ログはサーバー上で docker compose logs を実行して見る
      - name: Show status
        if: failure()
        run: docker compose ps -a
      - name: Prune old images
        run: docker image prune -f
      - name: Remove env file
        if: always()
        run: rm -f "$RUNNER_TEMP/step-learn.env"
