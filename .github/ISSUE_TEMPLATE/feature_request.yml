name: 機能要望
description: 新しい機能や改善を提案する
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 誰が・どんな場面で困っているかを書いてください
      placeholder: 教師が課題の提出状況を一覧で確認できない
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容
      description: どうなれば嬉しいか。画面のイメージがあれば添付してください
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 対象の機能
      options:
        - 認証・アカウント
        - コース
        - 教材（ページ / リンク / ファイル）
        - 参加者・ロール
        - 管理画面
        - 開発環境・インフラ
        - その他
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足
      description: Moodle など他の LMS での実現方法、検討した別の方法など
